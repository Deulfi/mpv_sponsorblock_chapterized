server=https://sponsor.ajay.app/api/skipSegments
# Categories to fetch and skip types are: sponsor, selfpromo, interaction, intro, outro, preview, music_offtopic
# preview, poi_highlight, filler, exclusive_access
# use '_' instead of ' '
categories=sponsor,selfpromo,interaction
# Categories that are only marked, not skipped
show_only_cats=intro, outro, music_offtopic, preview, poi_highlight, filler, exclusive_access
# NOTE: mpv config converts yes/no to boolean; script fix now checks truthiness (was broken string-compare)
hash=no
# Duration the OSD message shows up (in seconds)
show_msg_duration=3
# should the script skip unknown categories (not in categories or show_only_cats)? It will show them only otherwise.
skip_unknown=yes
# Minimum segment length in seconds (default: 1)
# Floating point tolerance for chapter boundary matching (default: 0.1)
